<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Countdown Timer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22185a"/>
      <stop offset="55%" stop-color="#120c2c"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cff"/>
      <stop offset="100%" stop-color="#00e0c6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="28"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round" stroke-dasharray="700 930" transform="rotate(-90 256 256)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#f4f6fb"/>
  <path d="M256 256 L256 168" stroke="#f4f6fb" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 256 L318 292" stroke="#c8c2ff" stroke-width="14" stroke-linecap="round"/>
</svg>
